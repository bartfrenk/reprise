name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: make lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      # Emacs and ChordPro run the tangle and chord-lookup integration tests.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends emacs-nox chordpro
      - run: uv sync --locked
      - run: make test
