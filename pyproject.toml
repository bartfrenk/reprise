[project]
name = "reprise"
version = "0.1.0"
description = "Tools for building ChordPro songbooks from Org files"
readme = "README.md"
authors = [
    { name = "Bart Frenk", email = "bart.frenk@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.3",
    "pydantic>=2.13.5",
]

[project.scripts]
reprise = "reprise.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 99
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 99

[tool.basedpyright]
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownLambdaType = false
reportImplicitStringConcatenation = false

[dependency-groups]
dev = [
    "basedpyright>=1.40.1",
    "black>=26.5.1",
    "isort>=9.0.2",
]
